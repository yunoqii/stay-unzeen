# Unzeen VPS stack: web + Caddy + three backend instances (devnet, mainnet, hood), each with its
# own Postgres, network, env file and state directory on the encrypted volume.
#
# Never run by hand with bare `docker compose`: use `unzeenctl` (infra/deploy/bin/unzeenctl), which
# passes --env-file /etc/unzeen/stack.env, the instance profiles and checks the volume is unlocked.
#
#   instance  profile  API (host loopback)  Zcash / chain                    state on the volume
#   devnet    devnet   127.0.0.1:8080       testnet / Solana devnet          $UNZEEN_VAULT/devnet/{home,pg}
#   mainnet   mainnet  127.0.0.1:8081       main / Solana mainnet-beta       $UNZEEN_VAULT/mainnet/{home,pg}
#   hood      hood     127.0.0.1:8082       main / Robinhood Chain 4663      $UNZEEN_VAULT/hood/{home,pg}
#
# Encrypted volume (N2): every bind mount of state uses create_host_path: false. While the volume
# is locked (after a reboot) the sources do not exist, so the containers refuse to start instead
# of writing a fresh database onto the unencrypted root disk. Web and Caddy keep running and the
# API origins answer 503 until `unzeen-unlock`.
#
# Secrets: per-instance env file /etc/unzeen/<instance>.env (0640 root:<admin>), key files in
# /etc/unzeen/keys/<instance>/ (0600, uid 10001), mounted read-only one file per service. Nothing
# secret is in this file or in the images.

name: unzeen-vps

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-app: &app
  <<: *hardening
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp"]

x-core: &core
  <<: *app
  image: unzeen-core:${UNZEEN_TAG:-dev}

x-adapters: &adapters
  <<: *app
  image: unzeen-adapters:${UNZEEN_TAG:-dev}

x-pg: &pg
  <<: *hardening
  image: postgres:17-alpine
  # The entrypoint starts as root, chowns PGDATA and drops to the postgres user.
  cap_drop: []
  # Privacy (review-day3 N3): no row values, failing statements or client addresses in the log.
  command:
    - postgres
    - -c
    - log_error_verbosity=terse
    - -c
    - log_min_error_statement=panic
    - -c
    - log_connections=off
    - -c
    - log_disconnections=off
    - -c
    - log_statement=none
  environment:
    POSTGRES_USER: unzeen
    POSTGRES_DB: unzeen
    POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
  shm_size: 256m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U unzeen -d unzeen"]
    interval: 5s
    timeout: 3s
    retries: 30

x-api-health: &api-health
  test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/api/feed"]
  interval: 15s
  timeout: 6s
  retries: 8
  start_period: 30s

# Overrides on top of the instance env file (same for every instance).
x-core-env: &core-env
  UNZEEN_HOME: /data/home
  HOME: /data/home
  API_BIND: 0.0.0.0:8080
  API_CORS_ORIGINS: https://${WEB_HOST:?set WEB_HOST in stack.env}
  UNZEEN_SEED_KEY_FILE: /run/unzeen-keys/seed.agekey
  UNZEEN_CHAT_KEY_FILE: /run/unzeen-keys/chat.key
  UNZEEN_SCENARIO_KEY_FILE: /run/unzeen-keys/scenario.key
  # Never set on the VPS (dev commands print deposit data).
  UNZEEN_DEV_PRINT: ""
  # Plain log lines (no ANSI codes) for unzeen-monitor's ALERT grep.
  NO_COLOR: "1"

# Relayer / indexer: never the owner's DATABASE_URL (RELAYER.md), never the Zcash seed.
x-adapters-env: &adapters-env
  UNZEEN_HOME: /data/home
  HOME: /data/home
  DATABASE_URL: ""
  UNZEEN_SEED_KEY_FILE: ""
  SOLANA_KEYS_AGE_KEY_FILE: /run/unzeen-keys/solana.agekey
  HOOD_KEYS_AGE_KEY_FILE: /run/unzeen-keys/hood-evm.agekey

services:
  # ---------------------------------------------------------------- image builds (profile "build")
  build-core:
    image: unzeen-core:${UNZEEN_TAG:-dev}
    build:
      context: ../../core
      dockerfile: ../infra/deploy/docker/core.Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-}
    profiles: ["build"]
    command: ["true"]

  build-adapters:
    image: unzeen-adapters:${UNZEEN_TAG:-dev}
    build:
      context: ../../adapters
      dockerfile: ../infra/deploy/docker/adapters.Dockerfile
    profiles: ["build"]
    command: ["true"]

  # ---------------------------------------------------------------- edge
  web:
    <<: *hardening
    image: unzeen-web:${UNZEEN_TAG:-dev}
    build:
      context: ../../web
      dockerfile: ../infra/deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: real
        NEXT_PUBLIC_SITE_URL: https://${WEB_HOST}
        NEXT_PUBLIC_API_URL_DEVNET: https://${API_DEVNET_HOST:?set API_DEVNET_HOST}
        NEXT_PUBLIC_API_URL_MAINNET: https://${API_MAINNET_HOST:?set API_MAINNET_HOST}
        NEXT_PUBLIC_API_URL_HOOD: https://${API_HOOD_HOST:?set API_HOOD_HOST}
        NEXT_PUBLIC_WS_URL_DEVNET: wss://${API_DEVNET_HOST}
        NEXT_PUBLIC_WS_URL_MAINNET: wss://${API_MAINNET_HOST}
        NEXT_PUBLIC_WS_URL_HOOD: wss://${API_HOOD_HOST}
        NEXT_PUBLIC_ATTESTATION_PUBKEY_DEVNET: ${NEXT_PUBLIC_ATTESTATION_PUBKEY_DEVNET:-}
        NEXT_PUBLIC_ATTESTATION_PUBKEY_MAINNET: ${NEXT_PUBLIC_ATTESTATION_PUBKEY_MAINNET:-}
        NEXT_PUBLIC_ATTESTATION_PUBKEY_HOOD: ${NEXT_PUBLIC_ATTESTATION_PUBKEY_HOOD:-}
        NEXT_PUBLIC_HOOD: ${NEXT_PUBLIC_HOOD:-1}
        NEXT_PUBLIC_FAIR_LAUNCH_BUILD: ${NEXT_PUBLIC_FAIR_LAUNCH_BUILD:-}
        WEB_BUILD_SCRIPT: ${WEB_BUILD_SCRIPT:-build:public}
    cap_drop: ["ALL"]
    networks: [edge]
    ports: ["127.0.0.1:3100:3000"]

  caddy:
    <<: *hardening
    image: unzeen-caddy:${UNZEEN_TAG:-dev}
    build:
      context: ./docker
      dockerfile: caddy.Dockerfile
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    depends_on: [web]
    environment:
      WEB_HOST: ${WEB_HOST}
      API_DEVNET_HOST: ${API_DEVNET_HOST}
      API_MAINNET_HOST: ${API_MAINNET_HOST}
      API_HOOD_HOST: ${API_HOOD_HOST}
      RL_API_READ_EVENTS: ${RL_API_READ_EVENTS:-300}
      RL_API_WRITE_EVENTS: ${RL_API_WRITE_EVENTS:-30}
      RL_WS_EVENTS: ${RL_WS_EVENTS:-30}
      RL_WEB_EVENTS: ${RL_WEB_EVENTS:-600}
    ports: ["80:80", "443:443"]
    # Extra sites proxy to services on the host: reverse_proxy host.docker.internal:<port>.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # Extra sites of other projects on this host (owner-managed, kept out of the repo).
      - type: bind
        source: /etc/unzeen/caddy.d
        target: /etc/caddy/sites
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  # ---------------------------------------------------------------- devnet (Zcash testnet + Solana devnet)
  pg-devnet:
    <<: *pg
    profiles: ["devnet"]
    networks: [devnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/devnet/pg", target: /var/lib/postgresql/data, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/devnet/pg-password", target: /run/secrets/pg-password, read_only: true, bind: { create_host_path: false } }

  api-devnet:
    <<: *core
    profiles: ["devnet"]
    command: ["unzeen-api", "serve"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/devnet.env"]
    environment:
      <<: *core-env
      UNZEEN_METADATA_BASE_URL: https://${API_DEVNET_HOST}/media
    depends_on: { pg-devnet: { condition: service_healthy } }
    healthcheck: *api-health
    networks: [devnet, edge]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/devnet/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/devnet/chat.key", target: /run/unzeen-keys/chat.key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/devnet/scenario.key", target: /run/unzeen-keys/scenario.key, read_only: true, bind: { create_host_path: false } }

  scanner-devnet:
    <<: *core
    profiles: ["devnet"]
    command: ["unzeen-scanner", "serve"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/devnet.env"]
    environment: *core-env
    depends_on: { api-devnet: { condition: service_healthy } }
    networks: [devnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/devnet/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/devnet/seed.agekey", target: /run/unzeen-keys/seed.agekey, read_only: true, bind: { create_host_path: false } }

  relayer-devnet:
    <<: *adapters
    profiles: ["devnet"]
    command: ["node_modules/.bin/tsx", "scripts/relayer-run.ts"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/devnet.env"]
    environment:
      <<: *adapters-env
      UNZEEN_METADATA_BASE_URL: https://${API_DEVNET_HOST}/media
    depends_on: { api-devnet: { condition: service_healthy } }
    networks: [devnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/devnet/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/devnet/solana.agekey", target: /run/unzeen-keys/solana.agekey, read_only: true, bind: { create_host_path: false } }

  intel-devnet:
    <<: *adapters
    profiles: ["devnet"]
    command: ["node_modules/.bin/tsx", "scripts/intel-run.ts"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/devnet.env"]
    environment:
      <<: *adapters-env
      DATABASE_URL_RELAYER: ""
      SOLANA_KEYS_AGE_KEY_FILE: ""
    depends_on: { api-devnet: { condition: service_healthy } }
    networks: [devnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/devnet/home", target: /data/home, bind: { create_host_path: false } }

  # ---------------------------------------------------------------- mainnet (Zcash main + Solana mainnet-beta)
  pg-mainnet:
    <<: *pg
    profiles: ["mainnet"]
    networks: [mainnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/mainnet/pg", target: /var/lib/postgresql/data, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/mainnet/pg-password", target: /run/secrets/pg-password, read_only: true, bind: { create_host_path: false } }

  api-mainnet:
    <<: *core
    profiles: ["mainnet"]
    command: ["unzeen-api", "serve"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/mainnet.env"]
    environment:
      <<: *core-env
      # GAP-5: public https base on the mainnet API origin (the URI is written on-chain forever).
      UNZEEN_METADATA_BASE_URL: https://${API_MAINNET_HOST}/media
    depends_on: { pg-mainnet: { condition: service_healthy } }
    healthcheck: *api-health
    networks: [mainnet, edge]
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/mainnet/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/mainnet/chat.key", target: /run/unzeen-keys/chat.key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/mainnet/scenario.key", target: /run/unzeen-keys/scenario.key, read_only: true, bind: { create_host_path: false } }

  scanner-mainnet:
    <<: *core
    profiles: ["mainnet"]
    command: ["unzeen-scanner", "serve"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/mainnet.env"]
    environment: *core-env
    depends_on: { api-mainnet: { condition: service_healthy } }
    networks: [mainnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/mainnet/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/mainnet/seed.agekey", target: /run/unzeen-keys/seed.agekey, read_only: true, bind: { create_host_path: false } }

  relayer-mainnet:
    <<: *adapters
    profiles: ["mainnet"]
    command: ["node_modules/.bin/tsx", "scripts/relayer-run.ts"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/mainnet.env"]
    environment:
      <<: *adapters-env
      UNZEEN_METADATA_BASE_URL: https://${API_MAINNET_HOST}/media
    depends_on: { api-mainnet: { condition: service_healthy } }
    networks: [mainnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/mainnet/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/mainnet/solana.agekey", target: /run/unzeen-keys/solana.agekey, read_only: true, bind: { create_host_path: false } }

  intel-mainnet:
    <<: *adapters
    profiles: ["mainnet"]
    command: ["node_modules/.bin/tsx", "scripts/intel-run.ts"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/mainnet.env"]
    environment:
      <<: *adapters-env
      DATABASE_URL_RELAYER: ""
      SOLANA_KEYS_AGE_KEY_FILE: ""
    depends_on: { api-mainnet: { condition: service_healthy } }
    networks: [mainnet]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/mainnet/home", target: /data/home, bind: { create_host_path: false } }

  # ---------------------------------------------------------------- hood (Zcash main + Robinhood Chain 4663)
  pg-hood:
    <<: *pg
    profiles: ["hood"]
    networks: [hood]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/hood/pg", target: /var/lib/postgresql/data, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/hood/pg-password", target: /run/secrets/pg-password, read_only: true, bind: { create_host_path: false } }

  api-hood:
    <<: *core
    profiles: ["hood"]
    command: ["unzeen-api", "serve"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/hood.env"]
    environment:
      <<: *core-env
      UNZEEN_METADATA_BASE_URL: https://${API_HOOD_HOST}/media
    depends_on: { pg-hood: { condition: service_healthy } }
    healthcheck: *api-health
    networks: [hood, edge]
    ports: ["127.0.0.1:8082:8080"]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/hood/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/hood/chat.key", target: /run/unzeen-keys/chat.key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/hood/scenario.key", target: /run/unzeen-keys/scenario.key, read_only: true, bind: { create_host_path: false } }

  scanner-hood:
    <<: *core
    profiles: ["hood"]
    command: ["unzeen-scanner", "serve"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/hood.env"]
    environment: *core-env
    depends_on: { api-hood: { condition: service_healthy } }
    networks: [hood]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/hood/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/hood/seed.agekey", target: /run/unzeen-keys/seed.agekey, read_only: true, bind: { create_host_path: false } }

  relayer-hood:
    <<: *adapters
    profiles: ["hood"]
    command: ["node_modules/.bin/tsx", "scripts/relayer-hood.ts"]
    env_file: ["${UNZEEN_ETC:-/etc/unzeen}/hood.env"]
    environment:
      <<: *adapters-env
      SOLANA_KEYS_AGE_KEY_FILE: ""
      UNZEEN_METADATA_BASE_URL: https://${API_HOOD_HOST}/media
    depends_on: { api-hood: { condition: service_healthy } }
    networks: [hood]
    volumes:
      - { type: bind, source: "${UNZEEN_VAULT:-/srv/unzeen}/hood/home", target: /data/home, bind: { create_host_path: false } }
      - { type: bind, source: "${UNZEEN_ETC:-/etc/unzeen}/keys/hood/hood-evm.agekey", target: /run/unzeen-keys/hood-evm.agekey, read_only: true, bind: { create_host_path: false } }

networks:
  edge: {}
  devnet: {}
  mainnet: {}
  hood: {}

volumes:
  caddy_data: {}
  caddy_config: {}
