# Unzeen infra: Postgres only (ledger / queue).
#
# Zcash access is via PUBLIC lightwalletd servers (see infra/README.md); no local node.
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d postgres

name: unzeen

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Privacy (review-day3 N3): Postgres must not write row values (DETAIL of constraint
    # errors), failing statements or client IPs (connection logs) to the container log.
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_statement=none
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unzeen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-unzeen}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"   # localhost only
    volumes:
      - pg-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unzeen} -d ${POSTGRES_DB:-unzeen}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
