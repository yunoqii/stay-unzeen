<!doctype html><html lang="en"><head><meta charset="utf-8"><title>unzeen · flat tape (before) vs folded two-layer tape (final v4)</title>
<link rel="stylesheet" href="base.css">
<style>
  body { width: 2000px; height: 1300px; padding: 40px 48px; }
  h1 { font: 600 24px "Geist"; margin-bottom: 20px; } h1 span { color: var(--fog-3); font-weight: 400; }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; }
  .col h2 { font: 500 13px "Geist Mono"; color: var(--fog-3); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
  .card { border-top: 1px solid var(--hair); padding: 16px 0; display: flex; gap: 22px; align-items: flex-end; }
  .card img { display: block; } .c { border-radius: 50%; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 11px "Geist Mono"; color: var(--fog-2); }
  .x { background: #000; padding: 8px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font: 700 14px "Geist"; color: #e7e9ea; } .x span { color: #71767b; font-weight: 400; }
</style></head><body>
<h1>Tape: before vs final <span>· flat one-tone strip (v3/D2a) → folded masking tape over a dark second piece (v4)</span></h1>
<div class="g">
<div class="col"><h2>before · flat</h2>
  <div class="card"><img src="../../v3/svg/d2a-tape-lockup-dark.svg" style="height:110px"></div>
  <div class="card"><figure><img src="../../v3/png/d-tape-favicon-16.png" width="16">16</figure><figure><img src="../../v3/png/d-tape-favicon-32.png" width="32">32</figure><figure><img src="../../v3/png/d-tape-favicon-48.png" width="48">48</figure>
    <figure><img class="c" src="../../v3/x/avatar-d@2x.png" width="150">X avatar</figure><figure><div class="x"><img class="c" src="../../v3/x/avatar-d.png" width="32"><div>unzeen <span>· 12s</span></div></div>X 32</figure></div>
  <div class="card"><img src="../../v3/x/banner-d.png" style="width:100%"></div></div>
<div class="col"><h2>final · folded, two-layer</h2>
  <div class="card"><img src="../../final/svg/unzeen-lockup-dark.svg" style="height:110px"></div>
  <div class="card"><figure><img src="../../final/png/favicon-16.png" width="16">16</figure><figure><img src="../../final/png/favicon-32.png" width="32">32</figure><figure><img src="../../final/png/favicon-48.png" width="48">48</figure>
    <figure><img class="c" src="../../final/x-avatar-400@2x.png" width="150">X avatar</figure><figure><div class="x"><img class="c" src="../../final/x-avatar-400.png" width="32"><div>unzeen <span>· 12s</span></div></div>X 32</figure></div>
  <div class="card"><img src="../../final/x-banner-1500x500.png" style="width:100%"></div></div>
</div>
<div style="margin-top:18px"><img src="../tape-kit.png" style="width:1100px;opacity:1"></div>
</body></html>
