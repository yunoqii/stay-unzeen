<!doctype html><html lang="en"><head><meta charset="utf-8"><title>unzeen · tape peel micro-interaction (prototype)</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Prototype for web: the tape over the z lifts off, shows the z for a beat, sticks back.
     Plays once on load and on hover/focus of the logo. transform + filter only. Reduced motion: no peel. */
  :root { --ease-out: cubic-bezier(.2,.8,.2,1); }
  body { width: 1200px; height: 520px; display: grid; place-items: center; background: var(--ink-1); }
  .logo { position: relative; display: inline-flex; align-items: baseline; font: 900 168px/1 "Geist"; letter-spacing: -0.045em; color: var(--paper); outline: none; cursor: default; }
  .z { position: relative; color: var(--zec); }
  .tape { position: absolute; left: -26%; top: 2%; width: 152%; height: 86%; transform-origin: 96% 50%;
          transform: rotate(-20deg); filter: drop-shadow(0 0 0 rgb(0 0 0 / 0)); }
  .tape path { fill: var(--zec); stroke: var(--ink-1); stroke-width: 3; paint-order: stroke; }
  .logo .tape { animation: peel 2.4s var(--ease-out) .5s 1 both; }
  .logo:hover .tape, .logo:focus-visible .tape { animation: peel 2.4s var(--ease-out) 0s 1 both; }
  @keyframes peel {
    0%, 12%  { transform: rotate(-20deg); filter: drop-shadow(0 0 0 rgb(0 0 0 / 0)); }
    34%      { transform: rotate(-58deg) translate(-4%, -10%) scaleX(.92); filter: drop-shadow(0 18px 14px rgb(0 0 0 / .55)); }
    62%      { transform: rotate(-58deg) translate(-4%, -10%) scaleX(.92); filter: drop-shadow(0 18px 14px rgb(0 0 0 / .55)); }
    80%      { transform: rotate(-17deg); filter: drop-shadow(0 4px 4px rgb(0 0 0 / .3)); }
    100%     { transform: rotate(-20deg); filter: drop-shadow(0 0 0 rgb(0 0 0 / 0)); }
  }
  @media (prefers-reduced-motion: reduce) { .logo .tape, .logo:hover .tape { animation: none; } }
  .still .logo .tape { animation: peel 2.4s linear -1.1s 1 both paused; }
  .cap { position: absolute; bottom: 36px; left: 0; right: 0; text-align: center; font: 13px "Geist Mono"; color: var(--fog-2); }
</style></head><body>
<a class="logo" tabindex="0" aria-label="unzeen">un<span class="z">z<svg class="tape" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0,0 L100,0 L88,10 L100,20 L88,30 L100,40 L0,40 Z"/></svg></span>een</a>
<div class="cap">hover the logo: the tape lifts, the z shows for a beat, the tape sticks back · prototype, reduced-motion safe</div>
<script>if (location.hash === "#still") document.body.classList.add("still");</script>
</body></html>
