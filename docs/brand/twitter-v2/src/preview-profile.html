<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Profile mock v2</title>
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1460px; height: 1880px; padding: 30px 40px; background: #000; }
  .pair { display: flex; gap: 40px; margin-bottom: 36px; align-items: flex-start; }
  .tag { font: 12px "Geist Mono", monospace; color: var(--fog-3); margin-bottom: 8px; }
  .desk { width: 900px; border: 1px solid #2f3336; } .mob { width: 390px; border: 1px solid #2f3336; border-radius: 22px; overflow: hidden; }
  .hdr { position: relative; aspect-ratio: 3 / 1; overflow: hidden; } .hdr img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mob .hdr { aspect-ratio: auto; height: 125px; } /* X mobile shows the header shorter: top and bottom get cropped */
  .body { position: relative; padding: 0 16px 18px; color: #e7e9ea; }
  .av { position: absolute; border-radius: 50%; border: 4px solid #000; }
  .desk .av { width: 134px; height: 134px; left: 16px; top: -67px; } .mob .av { width: 80px; height: 80px; left: 14px; top: -40px; }
  .name { padding-top: 78px; font-weight: 700; font-size: 20px; } .mob .name { padding-top: 48px; font-size: 18px; }
  .handle { color: #71767b; font-size: 15px; } .bio { margin-top: 10px; font-size: 15px; }
</style></head><body>
<script>
for (const v of ["1","2","3"]) {
  const card = (cls) => `<div class="${cls}"><div class="hdr"><img src="../banner-${v}@2x.png"></div><div class="body"><img class="av" src="../avatar-${v}@2x.png">
    <div class="name">unzeen</div><div class="handle">@stayunzeen (placeholder)</div><div class="bio">Launch anywhere. Stay unzeen.</div></div></div>`;
  document.write(`<div class="tag">banner-${v} + avatar-${v} · desktop (left) · mobile (right)</div><div class="pair">${card("desk")}${card("mob")}</div>`);
}
</script></body></html>
