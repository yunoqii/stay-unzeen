<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Profile mock</title>
<link rel="stylesheet" href="base.css">
<style>
  body { padding: 30px 40px; width: 1400px; height: 1780px; background: #000; color: #e7e9ea; }
  .pair { display: flex; gap: 40px; margin-bottom: 34px; align-items: flex-start; }
  .p { position: relative; background: #000; border: 1px solid #2f3336; }
  .p img.ban { display: block; width: 100%; }
  .p img.av { position: absolute; border-radius: 50%; border: 4px solid #000; }
  .info { font-family: -apple-system, "Geist", sans-serif; }
  .name { font-weight: 700; } .handle { color: #71767b; } .bio { margin-top: 8px; }
  .lab { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--fog-3); margin-bottom: 8px; }
  .desk { width: 900px; } .desk img.av { width: 200px; height: 200px; left: 22px; top: 200px; }
  .desk .info { padding: 112px 24px 20px; font-size: 20px; }
  .phone { width: 390px; border-radius: 22px; overflow: hidden; } .phone img.av { width: 84px; height: 84px; left: 14px; top: 92px; border-width: 3px; }
  .phone .info { padding: 52px 16px 16px; font-size: 15px; }
</style></head><body>
<script>
for (const v of ["a","b","c"]) document.write(`<div class="lab">banner-${v} + avatar-${v} (handle is a placeholder)</div><div class="pair">
 <div class="p desk"><img class="ban" src="../banner-${v}@2x.png"><img class="av" src="../avatar-${v}@2x.png"><div class="info"><div class="name">unzeen</div><div class="handle">@stayunzeen</div><div class="bio">Launch anywhere. Stay unzeen.</div></div></div>
 <div class="p phone"><img class="ban" src="../banner-${v}@2x.png"><img class="av" src="../avatar-${v}@2x.png"><div class="info"><div class="name">unzeen</div><div class="handle">@stayunzeen</div></div></div>
</div>`);
</script></body></html>
