<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Unzeen v3 logo sheet</title>
<link rel="stylesheet" href="base.css"><script src="dirs.js"></script>
<style>
  body { width: 1800px; padding: 40px 48px; }
  h1 { font: 500 15px "Geist Mono"; color: var(--fog-3); margin-bottom: 26px; letter-spacing: .02em; }
  .row { display: grid; grid-template-columns: 230px 330px 440px 1fr; gap: 28px; align-items: center; padding: 22px 0; border-top: 1px solid var(--hair); }
  .t b { display: block; font: 600 18px "Geist"; color: var(--paper); margin-bottom: 6px; }
  .t span { font: 12px/1.5 "Geist Mono"; color: var(--fog-3); }
  .lk img { height: 64px; display: block; border-radius: 6px; } .lk img + img { margin-top: 10px; }
  .sz { display: flex; gap: 18px; align-items: flex-end; }
  .sz figure { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 11px "Geist Mono"; color: var(--fog-2); }
  .circ { border-radius: 50%; overflow: hidden; display: block; }
  .zoom { image-rendering: pixelated; }
  .onx { background: #000; padding: 10px; border-radius: 8px; display: flex; gap: 12px; align-items: center; }
  .onx .nm { font: 700 15px "Geist"; color: #e7e9ea; } .onx .hd { font: 15px "Geist"; color: #71767b; }
</style></head><body>
<h1>unzeen · logo v3 · lockup dark / light · favicon 16 · 32 · 48 (1:1, browser raster) · 16 zoomed ×4 · X avatar circle 48 / 40</h1>
<script>
for (const d of DIRS) {
  const f = `../svg/${d.k}-${d.n}`;
  document.write(`<div class="row"><div class="t"><b>${d.title}</b><span>${d.line}</span></div>
  <div class="lk"><img src="${f}-lockup-dark.svg"><img src="${f}-lockup-light.svg"></div>
  <div class="sz">
    <figure><img src="${f}-favicon.svg" width="16" height="16">16</figure>
    <figure><img src="${f}-favicon.svg" width="32" height="32">32</figure>
    <figure><img src="${f}-favicon.svg" width="48" height="48">48</figure>
    <figure><img class="zoom" src="../png/${d.k}-${d.n}-favicon-16.png" width="64" height="64">16 ×4</figure>
    <figure><img src="${f}-mark-light.svg" width="48" height="48">light</figure>
  </div>
  <div class="sz">
    <div class="onx"><img class="circ" src="../x/avatar-${d.k}.png" width="48" height="48"><div><div class="nm">unzeen</div><div class="hd">@stayunzeen · 12s</div></div></div>
    <div class="onx"><img class="circ" src="../x/avatar-${d.k}.png" width="40" height="40"><img class="circ" src="../x/avatar-${d.k}.png" width="32" height="32"><img class="circ" src="../x/avatar-${d.k}.png" width="24" height="24"></div>
  </div></div>`);
}
</script></body></html>
