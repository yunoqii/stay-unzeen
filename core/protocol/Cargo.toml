[package]
name = "unzeen-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Unzeen wire formats: unz1 memo codec and signed HTTP requests (docs/API.md)"

[dependencies]
base64 = "0.22"
bip0039 = { version = "0.14", features = ["std"] }
unicode-normalization = "0.1"
bs58 = "0.5"
ed25519-dalek = "3"
hex = "0.4"
hmac = "0.13"
secp256k1 = { version = "0.33", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha3 = "0.10"
thiserror = "2"

[dev-dependencies]
bip0039 = { version = "0.14", features = ["std"] }
serde_json = "1"
