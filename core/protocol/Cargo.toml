[package]
name = "unzeen-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Unzeen wire formats: unz1 memo codec and signed HTTP requests (docs/API.md)"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
