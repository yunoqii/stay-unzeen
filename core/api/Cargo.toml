[package]
name = "unzeen-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Unzeen API server (docs/API.md): pool, portfolio, signed actions, feed, tokens, WS"

[[bin]]
name = "unzeen-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unzeen-ledger = { path = "../ledger" }
unzeen-protocol = { path = "../protocol" }
zcash_address = "=0.14.0-pre.1"
zcash_protocol = "=0.11.0-pre.0"

[dev-dependencies]
tokio-tungstenite = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
unzeen-protocol = { path = "../protocol" }
