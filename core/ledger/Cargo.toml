[package]
name = "unzeen-ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Unzeen private ledger (Postgres): deposits, balances, holds, journal, nonces"

[dependencies]
bytes = "1"
hex = "0.4"
hmac = "0.13"
rand = "0.10"
sha2 = "0.11"
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
unzeen-protocol = { path = "../protocol" }
unzeen-fair = { path = "../fair" }
ed25519-dalek = "3"
bs58 = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
hex = "0.4"
rand = "0.10"
